<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Diárias</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: #f2f2f2;

        }


        .container {

            width: 420px;

            max-width: 90%;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);

        }


        h1 {

            text-align: center;

            margin-top: 0;

            margin-bottom: 30px;

            font-size: 26px;

        }


        .campo {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }


        .linha-data {

            display: flex;

            gap: 8px;

        }


        input[type="text"] {

            flex: 1;

            min-width: 0;

            padding: 14px;

            font-size: 18px;

            border: 2px solid #ccc;

            border-radius: 8px;

            outline: none;

        }


        input[type="text"]:focus {

            border-color: #333;

        }


        .botao-calendario {

            width: 52px;

            flex-shrink: 0;

            padding: 0;

            border: 2px solid #ccc;

            border-radius: 8px;

            background: #f5f5f5;

            font-size: 23px;

            cursor: pointer;

        }


        .botao-calendario:hover {

            background: #e8e8e8;

        }


        .datepicker {

            position: absolute;

            width: 1px;

            height: 1px;

            opacity: 0;

            pointer-events: none;

        }


        .botoes {

            display: flex;

            gap: 10px;

            margin-top: 10px;

        }


        button {

            flex: 1;

            padding: 13px;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .calcular {

            background: #222;

            color: white;

        }


        .limpar {

            background: #ddd;

            color: #222;

        }


        button:hover {

            opacity: 0.85;

        }


        .resultado {

            margin-top: 30px;

            padding: 20px;

            text-align: center;

            border-radius: 10px;

            background: #f0f0f0;

        }


        .numero {

            display: block;

            font-size: 48px;

            font-weight: bold;

            margin-bottom: 5px;

        }


        .texto {

            font-size: 18px;

        }


        .copiar {

            width: 100%;

            margin-top: 15px;

            background: #ddd;

            color: #222;

        }


        .mensagem {

            margin-top: 15px;

            text-align: center;

            font-size: 14px;

            color: #b00020;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>Calculadora de Diárias</h1>


    <!-- =====================================================
         RETIRADA
         ===================================================== -->

    <div class="campo">

        <label for="retirada">

            Retirada

        </label>


        <div class="linha-data">

            <input
                type="text"
                id="retirada"
                maxlength="12"
                placeholder="DDMMAAAAHHMM"
                inputmode="numeric"
                onfocus="campoEntrou(this)"
                onblur="campoSaiu(this)"
            >


            <button
                type="button"
                class="botao-calendario"
                onclick="abrirCalendario('retirada')"
                title="Selecionar data e hora"
            >

                📅

            </button>


            <input
                type="datetime-local"
                id="datepicker-retirada"
                class="datepicker"
                onchange="dataSelecionada('retirada')"
            >

        </div>

    </div>


    <!-- =====================================================
         DEVOLUÇÃO
         ===================================================== -->

    <div class="campo">

        <label for="devolucao">

            Devolução

        </label>


        <div class="linha-data">

            <input
                type="text"
                id="devolucao"
                maxlength="12"
                placeholder="DDMMAAAAHHMM"
                inputmode="numeric"
                onfocus="campoEntrou(this)"
                onblur="campoSaiu(this)"
            >


            <button
                type="button"
                class="botao-calendario"
                onclick="abrirCalendario('devolucao')"
                title="Selecionar data e hora"
            >

                📅

            </button>


            <input
                type="datetime-local"
                id="datepicker-devolucao"
                class="datepicker"
                onchange="dataSelecionada('devolucao')"
            >

        </div>

    </div>


    <!-- =====================================================
         BOTÕES
         ===================================================== -->

    <div class="botoes">

        <button
            class="calcular"
            onclick="calcularDiarias()"
        >

            CALCULAR

        </button>


        <button
            class="limpar"
            onclick="limpar()"
        >

            LIMPAR

        </button>

    </div>


    <!-- =====================================================
         RESULTADO
         ===================================================== -->

    <div class="resultado">

        <span
            class="numero"
            id="numeroResultado"
        >

            0

        </span>


        <span
            class="texto"
            id="textoResultado"
        >

            diárias

        </span>


        <button
            class="copiar"
            onclick="copiarResultado()"
        >

            COPIAR RESULTADO

        </button>

    </div>


    <div
        class="mensagem"
        id="mensagem"
    ></div>


</div>


<script>


// ============================================================
// QUANDO ENTRA NO CAMPO
//
// Remove a formatação.
//
// Exemplo:
//
// 19/08/2026 11:00
//
// vira:
//
// 190820261100
// ============================================================

function campoEntrou(campo) {


    let valor =
        campo.value.replace(/\D/g, "");


    // ========================================================
    // Se tiver ano com 4 dígitos, mantém normalmente.
    // ========================================================

    if (valor.length === 12) {

        campo.value = valor;

        return;

    }


    // ========================================================
    // Se estiver formatado, normalmente teremos 12 números.
    // ========================================================

    campo.value = valor;

}



// ============================================================
// QUANDO SAI DO CAMPO
//
// Aqui fazemos a formatação.
//
// Também aceitamos:
//
// DDMMAAHHMM
//
// Exemplo:
//
// 1908261100
//
// vira internamente:
//
// 190820261100
//
// e depois:
//
// 19/08/2026 11:00
// ============================================================

function campoSaiu(campo) {


    let valor =
        campo.value.replace(/\D/g, "");


    // ========================================================
    // ANO COM DOIS DÍGITOS
    //
    // 1908261100
    //
    // DD MM AA HH MM
    //
    // vira:
    //
    // DD MM 20AA HH MM
    // ========================================================

    if (valor.length === 10) {

        valor =
            valor.substring(0, 4) +
            "20" +
            valor.substring(4);

    }


    // ========================================================
    // Se não tiver 12 caracteres, não tenta formatar.
    // ========================================================

    if (valor.length !== 12) {

        campo.value = valor;

        return;

    }


    // ========================================================
    // SEPARA OS COMPONENTES
    // ========================================================

    const dia =
        valor.substring(0, 2);


    const mes =
        valor.substring(2, 4);


    const ano =
        valor.substring(4, 8);


    const hora =
        valor.substring(8, 10);


    const minuto =
        valor.substring(10, 12);


    // ========================================================
    // FORMATA
    // ========================================================

    campo.value =
        dia +
        "/" +
        mes +
        "/" +
        ano +
        " " +
        hora +
        ":" +
        minuto;

}



// ============================================================
// ABRIR CALENDÁRIO
// ============================================================

function abrirCalendario(tipo) {


    const calendario =
        document.getElementById(
            "datepicker-" + tipo
        );


    if (calendario.showPicker) {

        calendario.showPicker();

    }

    else {

        calendario.click();

    }

}



// ============================================================
// DATA SELECIONADA PELO CALENDÁRIO
// ============================================================

function dataSelecionada(tipo) {


    const calendario =
        document.getElementById(
            "datepicker-" + tipo
        );


    const campo =
        document.getElementById(
            tipo
        );


    if (!calendario.value) {

        return;

    }


    // ========================================================
    // datetime-local retorna:
    //
    // 2026-08-19T11:00
    // ========================================================

    const partes =
        calendario.value.split("T");


    const data =
        partes[0].split("-");


    const hora =
        partes[1].split(":");


    const ano =
        data[0];


    const mes =
        data[1];


    const dia =
        data[2];


    const horas =
        hora[0];


    const minutos =
        hora[1];


    campo.value =
        dia +
        "/" +
        mes +
        "/" +
        ano +
        " " +
        horas +
        ":" +
        minutos;

}



// ============================================================
// CONVERTER DATA
// ============================================================

function converterData(valor) {


    let numeros =
        valor.replace(/\D/g, "");


    // ========================================================
    // ACEITA ANO COM DOIS DÍGITOS
    // ========================================================

    if (numeros.length === 10) {

        numeros =
            numeros.substring(0, 4) +
            "20" +
            numeros.substring(4);

    }


    // ========================================================
    // PRECISA TER 12 CARACTERES
    // ========================================================

    if (numeros.length !== 12) {

        return null;

    }


    const dia =
        Number(
            numeros.substring(0, 2)
        );


    const mes =
        Number(
            numeros.substring(2, 4)
        ) - 1;


    const ano =
        Number(
            numeros.substring(4, 8)
        );


    const hora =
        Number(
            numeros.substring(8, 10)
        );


    const minuto =
        Number(
            numeros.substring(10, 12)
        );


    const data =
        new Date(
            ano,
            mes,
            dia,
            hora,
            minuto
        );


    // ========================================================
    // VALIDAÇÃO
    // ========================================================

    if (

        data.getFullYear() !== ano ||

        data.getMonth() !== mes ||

        data.getDate() !== dia ||

        data.getHours() !== hora ||

        data.getMinutes() !== minuto

    ) {

        return null;

    }


    return data;

}



// ============================================================
// CALCULAR DIÁRIAS
//
// REGRA:
//
// Antes das 12:00
// → pertence ao dia operacional anterior.
//
// 12:00 ou depois
// → pertence ao próprio dia.
//
// A diferença entre as datas operacionais determina
// a quantidade de diárias.
//
// Mínimo = 1.
// ============================================================

function calcularDiarias() {


    const campoRetirada =
        document.getElementById(
            "retirada"
        );


    const campoDevolucao =
        document.getElementById(
            "devolucao"
        );


    const mensagem =
        document.getElementById(
            "mensagem"
        );


    mensagem.textContent = "";

    mensagem.style.color =
        "#b00020";


    // ========================================================
    // CONVERTE AS DATAS
    // ========================================================

    const retirada =
        converterData(
            campoRetirada.value
        );


    const devolucao =
        converterData(
            campoDevolucao.value
        );


    // ========================================================
    // VALIDAÇÕES
    // ========================================================

    if (!retirada) {

        mensagem.textContent =
            "Informe uma data de retirada válida.";

        return;

    }


    if (!devolucao) {

        mensagem.textContent =
            "Informe uma data de devolução válida.";

        return;

    }


    if (devolucao < retirada) {

        mensagem.textContent =
            "A devolução não pode ser anterior à retirada.";

        return;

    }


    // ========================================================
    // DATA OPERACIONAL
    // ========================================================

    function dataOperacional(data) {


        const resultado =
            new Date(
                data.getFullYear(),
                data.getMonth(),
                data.getDate()
            );


        // Antes do meio-dia pertence ao dia anterior.

        if (data.getHours() < 12) {

            resultado.setDate(
                resultado.getDate() - 1
            );

        }


        return resultado;

    }


    // ========================================================
    // CONVERTE PARA DATA OPERACIONAL
    // ========================================================

    const retiradaOperacional =
        dataOperacional(
            retirada
        );


    const devolucaoOperacional =
        dataOperacional(
            devolucao
        );


    // ========================================================
    // DIFERENÇA
    // ========================================================

    const diferenca =
        Math.round(

            (
                devolucaoOperacional -
                retiradaOperacional
            )

            /

            (1000 * 60 * 60 * 24)

        );


    // ========================================================
    // MÍNIMO DE UMA DIÁRIA
    // ========================================================

    const diarias =
        Math.max(
            1,
            diferenca
        );


    // ========================================================
    // RESULTADO
    // ========================================================

    document.getElementById(
        "numeroResultado"
    ).textContent =
        diarias;


    document.getElementById(
        "textoResultado"
    ).textContent =

        diarias === 1
            ? "diária"
            : "diárias";

}



// ============================================================
// COPIAR RESULTADO
// ============================================================

function copiarResultado() {


    const resultado =
        document.getElementById(
            "numeroResultado"
        ).textContent;


    if (resultado === "0") {

        return;

    }


    navigator.clipboard.writeText(
        resultado
    );


    const mensagem =
        document.getElementById(
            "mensagem"
        );


    mensagem.style.color =
        "#008000";


    mensagem.textContent =
        "Resultado copiado!";


    setTimeout(

        function() {

            mensagem.textContent = "";

        },

        2000

    );

}



// ============================================================
// LIMPAR
// ============================================================

function limpar() {


    document.getElementById(
        "retirada"
    ).value = "";


    document.getElementById(
        "devolucao"
    ).value = "";


    document.getElementById(
        "datepicker-retirada"
    ).value = "";


    document.getElementById(
        "datepicker-devolucao"
    ).value = "";


    document.getElementById(
        "numeroResultado"
    ).textContent = "0";


    document.getElementById(
        "textoResultado"
    ).textContent =
        "diárias";


    document.getElementById(
        "mensagem"
    ).textContent = "";

}

</script>


</body>

</html>
